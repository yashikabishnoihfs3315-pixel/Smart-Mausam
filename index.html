<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WeatherTrack Pro — Compact Dashboard</title>
  <!-- Google Fonts & Remix Icons CDN -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-theme="light">

  <div class="app-container">

    <!-- ===================================
         COMPACT HEADER & NAVBAR
    =================================== -->
    <header class="navbar">
      <div class="logo">
        <i class="ri-cloud-windy-line"></i>
        <span>WeatherTrack</span>
      </div>

      <form class="search-form" id="search-form">
        <div class="input-group">
          <i class="ri-search-line search-icon"></i>
          <input type="text" id="search-input" placeholder="Search city..." autocomplete="off" required>
        </div>
        <button type="submit" class="btn btn-primary" title="Search">
          <i class="ri-search-line"></i>
        </button>
      </form>

      <div class="nav-controls">
        <button id="location-btn" class="btn btn-secondary" title="Use GPS Location">
          <i class="ri-map-pin-user-line"></i>
          <span class="btn-text">Location</span>
        </button>
        <button id="unit-toggle" class="btn btn-icon" title="Toggle °C / °F">
          <span id="unit-label">°C</span>
        </button>
        <button id="theme-toggle" class="btn btn-icon" title="Toggle Dark/Light Mode">
          <i class="ri-moon-line" id="theme-icon"></i>
        </button>
      </div>
    </header>

    <!-- ===================================
         FAVORITES STRIP
    =================================== -->
    <section class="favorites-bar" id="favorites-bar">
      <span class="fav-title"><i class="ri-star-line"></i> Saved:</span>
      <div class="fav-list" id="fav-list">
        <!-- Dynamically populated -->
      </div>
    </section>

    <!-- ===================================
         STATUS / ALERT MESSAGE
    =================================== -->
    <div id="status-message" class="status-message hidden"></div>

    <!-- ===================================
         COMPACT DASHBOARD GRID
    =================================== -->
    <main class="dashboard-grid" id="dashboard">

      <!-- LEFT COLUMN: MAIN WEATHER & QUICK STATS -->
      <div class="left-col">
        <!-- HERO CARD -->
        <section class="card hero-card">
          <div class="hero-top">
            <div>
              <div class="location-heading">
                <h1 id="city-name">Bhopal</h1>
                <span id="country-code" class="badge">IN</span>
                <button id="fav-btn" class="fav-star-btn" title="Save to Favorites">
                  <i class="ri-star-line" id="fav-icon"></i>
                </button>
              </div>
              <p id="local-time" class="subtitle">Fetching time...</p>
            </div>
            <div class="weather-badge" id="condition-badge">
              <span id="weather-condition">Partly Cloudy</span>
            </div>
          </div>

          <div class="hero-body">
            <div class="temp-display">
              <span id="current-temp">--</span>
              <span class="temp-unit">°C</span>
            </div>
            <i class="ri-cloud-sun-line weather-hero-icon" id="hero-weather-icon"></i>
          </div>

          <div class="hero-footer">
            <span>Feels like <strong id="feels-like">--°C</strong></span>
            <span>•</span>
            <span>Updated: <span id="last-updated">Just now</span></span>
          </div>
        </section>

        <!-- DETAILS GRID -->
        <section class="details-grid">
          <div class="card detail-card">
            <i class="ri-drop-line detail-icon"></i>
            <span class="detail-label">Humidity</span>
            <span class="detail-value" id="val-humidity">--%</span>
          </div>
          <div class="card detail-card">
            <i class="ri-windy-line detail-icon"></i>
            <span class="detail-label">Wind</span>
            <span class="detail-value" id="val-wind">-- km/h</span>
          </div>
          <div class="card detail-card">
            <i class="ri-dashboard-3-line detail-icon"></i>
            <span class="detail-label">Pressure</span>
            <span class="detail-value" id="val-pressure">-- hPa</span>
          </div>
          <div class="card detail-card">
            <i class="ri-eye-line detail-icon"></i>
            <span class="detail-label">Visibility</span>
            <span class="detail-value" id="val-visibility">-- km</span>
          </div>
          <div class="card detail-card">
            <i class="ri-sun-fog-line detail-icon"></i>
            <span class="detail-label">UV Index</span>
            <span class="detail-value" id="val-uv">--</span>
          </div>
          <div class="card detail-card">
            <i class="ri-cloud-line detail-icon"></i>
            <span class="detail-label">Precipitation</span>
            <span class="detail-value" id="val-precip">-- mm</span>
          </div>
          <div class="card detail-card">
            <i class="ri-sun-line detail-icon"></i>
            <span class="detail-label">Sunrise</span>
            <span class="detail-value" id="val-sunrise">--:--</span>
          </div>
          <div class="card detail-card">
            <i class="ri-moon-clear-line detail-icon"></i>
            <span class="detail-label">Sunset</span>
            <span class="detail-value" id="val-sunset">--:--</span>
          </div>
        </section>
      </div>

      <!-- RIGHT COLUMN: HOURLY & DAILY FORECAST -->
      <div class="right-col">
        <section class="card forecast-card">
          <h2 class="card-title"><i class="ri-time-line"></i> Hourly Forecast</h2>
          <div class="hourly-container" id="hourly-container">
            <!-- Dynamically populated -->
          </div>
        </section>

        <section class="card forecast-card">
          <h2 class="card-title"><i class="ri-calendar-line"></i> 7-Day Forecast</h2>
          <div class="daily-container" id="daily-container">
            <!-- Dynamically populated -->
          </div>
        </section>
      </div>

    </main>

    <footer class="app-footer">
      <span>Powered by Open-Meteo · WeatherTrack Pro</span>
    </footer>

  </div>

  <script src="script.js"></script>
</body>
</html>
